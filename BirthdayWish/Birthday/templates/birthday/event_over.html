{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0B1026">
  <meta name="description" content="This little surprise has come to an end.">
  <meta name="robots" content="noindex,nofollow">

  <meta property="og:type" content="website">
  <meta property="og:title" content="✨ The Magic Has Ended ✨">
  <meta property="og:description" content="This little surprise has come to an end.">
  <meta property="og:image" content="{% static 'birthday/icons/og-cover.svg' %}">
  <meta property="og:url" content="{{ request.build_absolute_uri }}">

  <link rel="icon" href="{% static 'birthday/icons/favicon.svg' %}" type="image/svg+xml">
  <link rel="manifest" href="{% url 'birthday:manifest' %}">

  <title>✨ Better Luck Next Time ✨</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'birthday/css/variables.css' %}">
  <link rel="stylesheet" href="{% static 'birthday/css/event_over.css' %}">
</head>
<body class="event-over">
  <div class="eo-bg" aria-hidden="true">
    <div class="eo-bg__gradient"></div>
    <div class="eo-bg__aurora"></div>
    <div class="eo-bg__vignette"></div>
    <canvas id="eo-particles" class="eo-particles"></canvas>
    <div class="eo-floaters" id="eo-floaters"></div>
  </div>

  <main class="eo-main" id="main">
    <div class="eo-card">
      <p class="eo-eyebrow">It's Packup Time</p>
      <h1 class="eo-title">✨ Thanks For Visiting ✨</h1>
      <p class="eo-lead">This little surprise has ended.</p>
      <p class="eo-thanks">Thank you for visiting  WebAPP , <b class="eo-emphasis">Means A Lot.</b> ❤️</p>
      <p class="eo-whisper">Maybe another surprise is waiting someday(whenever You'll wish)...</p>
    </div>
  </main>

  <script src="{% static 'birthday/js/event_over.js' %}" defer></script>
</body>
</html>
